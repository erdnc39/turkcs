<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TurkCS — Canlı TV</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#05070a; color:#e6edf3;
               font-family: "Segoe UI", Roboto, system-ui, sans-serif;
               height:100%; overflow-x:hidden; }
  header { position:sticky; top:0; z-index:50; background:linear-gradient(180deg,#0b1016 75%,rgba(11,16,22,.85));
           padding:14px 26px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
           border-bottom:1px solid #1b2530; }
  h1 { font-size:26px; margin:0; letter-spacing:.5px; }
  h1 small { font-size:14px; color:#7d8894; font-weight:400; margin-left:10px; }
  .chip { font-size:13px; padding:5px 12px; border-radius:20px; background:#111a24; border:1px solid #22303f; color:#9fb0c3; }
  .chip b { color:#e6edf3; }
  .chip.ok { border-color:#1f6f3f; color:#7ee2a8; }
  .chip.err { border-color:#7a2530; color:#ff9aa2; }
  .badge { font-size:11px; padding:3px 9px; border-radius:6px; font-weight:700; letter-spacing:.4px; }
  .b-rectv { background:#123a6b; color:#8fc1ff; }
  .b-inat  { background:#5a2a12; color:#ffb27a; }
  .b-canli { background:#14472a; color:#8ff0b6; }
  #arama { flex:1; min-width:220px; max-width:420px; font-size:17px; padding:9px 14px; border-radius:10px;
           background:#0e1620; border:1px solid #22303f; color:#e6edf3; outline:none; }
  #arama:focus { border-color:#2f81f7; box-shadow:0 0 0 2px rgba(47,129,247,.35); }
  #filtreler { display:flex; gap:10px; padding:12px 26px 0; flex-wrap:wrap; }
  .filtre { font-size:14px; padding:7px 15px; border-radius:18px; background:#0e1620; border:1px solid #1b2530;
            color:#9fb0c3; cursor:pointer; }
  .filtre.aktif { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  main { padding:16px 26px 60px; }
  .kaynak-baslik { font-size:19px; margin:26px 0 12px; color:#c7d2de; display:flex; align-items:center; gap:10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; }
  .kart { display:flex; gap:12px; align-items:center; background:#0e141c; border:1px solid #18212c;
          border-radius:14px; padding:12px; cursor:pointer; text-decoration:none; color:inherit;
          transition:transform .08s ease, border-color .08s, background .08s; min-height:86px; }
  .kart:hover, .kart:focus { outline:none; border-color:#2f81f7; background:#121b26; transform:scale(1.03);
                             box-shadow:0 6px 22px rgba(47,129,247,.25); }
  .logo { width:84px; height:56px; border-radius:8px; background:#18222e; object-fit:cover; flex:none;
          display:flex; align-items:center; justify-content:center; font-size:24px; color:#3d4a59; overflow:hidden; }
  .bilgi { min-width:0; }
  .ad { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .alt { display:flex; gap:8px; align-items:center; margin-top:6px; flex-wrap:wrap; }
  .etiket { font-size:12px; color:#8b98a8; background:#141d27; padding:2px 8px; border-radius:6px; }
  .aciklama { font-size:12px; color:#6f7d8d; margin-top:4px; display:-webkit-box; -webkit-line-clamp:2;
              -webkit-box-orient:vertical; overflow:hidden; }
  #bos { text-align:center; color:#7d8894; padding:60px 20px; font-size:18px; }
  #durum { position:fixed; right:18px; bottom:18px; background:#0e1620; border:1px solid #22303f;
           border-radius:10px; padding:10px 14px; font-size:13px; color:#9fb0c3; z-index:60; }
  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#238636; color:#fff;
           padding:12px 22px; border-radius:10px; display:none; font-size:15px; z-index:99; }
  .ipucu { color:#6f7d8d; font-size:13px; padding:6px 26px 0; }
</style>
</head>
<body>

<header>
  <h1>📺 TurkCS Canlı TV<small id="toplam">…</small></h1>
  <input id="arama" type="text" placeholder="Kanal ara…  (yazmaya başla)" autocomplete="off">
  <span class="chip" id="chip-rectv">RecTV <b>…</b></span>
  <span class="chip" id="chip-inat">InatBox <b>…</b></span>
  <span class="chip" id="chip-canli">CanliTV <b>…</b></span>
</header>

<div id="filtreler">
  <span class="filtre aktif" data-kaynak="hepsi">Hepsi</span>
  <span class="filtre" data-kaynak="RecTV">RecTV</span>
  <span class="filtre" data-kaynak="InatBox">InatBox</span>
  <span class="filtre" data-kaynak="CanliTV">CanliTV (m3u)</span>
</div>

<div class="ipucu">↑ ↓ ← → ile gezin · Enter ile aç · yazıp ara · <b>C</b> ile linki kopyala</div>

<main id="icerik"><div id="bos">Kanallar yükleniyor…</div></main>
<div id="durum">veri çekiliyor…</div>
<div id="toast"></div>

<script>
let TUM = [], KAYNAK = "hepsi", ARAMA = "";

function kartYap(k) {
  const a = document.createElement("a");
  a.className = "kart";
  a.href = k.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.dataset.kaynak = k.kaynak;
  a.dataset.ad = (k.ad || "").toLowerCase();
  const rozet = k.kaynak === "RecTV" ? "b-rectv" : (k.kaynak === "InatBox" ? "b-inat" : "b-canli");
  const ilk = (k.ad || "?").trim().charAt(0).toUpperCase();
  const gorsel = k.gorsel
    ? `<img class="logo" src="${k.gorsel}" loading="lazy" onerror="this.outerHTML='<div class=logo>${ilk}</div>'">`
    : `<div class="logo">${ilk}</div>`;
  a.innerHTML = `${gorsel}
    <div class="bilgi">
      <div class="ad" title="${(k.ad||"").replace(/"/g,"&quot;")}">${k.ad}</div>
      <div class="alt">
        <span class="badge ${rozet}">${k.kaynak}</span>
        ${k.etiket ? `<span class="etiket">${k.etiket}</span>` : ""}
      </div>
      ${k.aciklama ? `<div class="aciklama">${k.aciklama}</div>` : ""}
    </div>`;
  a.addEventListener("contextmenu", e => { e.preventDefault(); kopyala(k.url); });
  return a;
}

function kopyala(url) {
  const t = document.getElementById("toast");
  const goster = m => { t.textContent = m; t.style.display = "block";
                        setTimeout(() => t.style.display = "none", 3500); };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => goster("✅ Link kopyalandı"))
    .catch(() => goster("Kopyalanamadı"));
  else goster(url);
}

function ciz() {
  const kutu = document.getElementById("icerik");
  const list = TUM.filter(k =>
    (KAYNAK === "hepsi" || k.kaynak === KAYNAK) &&
    (!ARAMA || (k.ad || "").toLowerCase().includes(ARAMA)));
  kutu.innerHTML = "";
  if (!list.length) { kutu.innerHTML = '<div id="bos">Kayıt bulunamadı</div>'; return; }

  const gruplar = {};
  list.forEach(k => { (gruplar[k.kaynak] = gruplar[k.kaynak] || []).push(k); });
  ["RecTV", "InatBox", "CanliTV"].forEach(ad => {
    const dizi = gruplar[ad];
    if (!dizi || !dizi.length) return;
    const b = document.createElement("div");
    b.className = "kaynak-baslik";
    b.innerHTML = `${ad} <span class="etiket">${dizi.length} kanal</span>`;
    kutu.appendChild(b);
    const g = document.createElement("div");
    g.className = "grid";
    dizi.forEach(k => g.appendChild(kartYap(k)));
    kutu.appendChild(g);
  });
  document.getElementById("toplam").textContent = ` · ${list.length} kanal`;
}

function durumCiz(veri) {
  const k = veri.kaynaklar || {};
  const ayar = [["rectv", "RecTV"], ["inat", "InatBox"], ["canli", "CanliTV"]];
  ayar.forEach(([id, ad]) => {
    const s = k[ad] || { adet: 0, durum: "yok" };
    const el = document.getElementById("chip-" + id);
    el.className = "chip " + (s.durum === "ok" ? "ok" : "err");
    el.innerHTML = `${ad} <b>${s.adet ?? 0}</b>${s.durum === "ok" ? "" : " ⚠"}`;
    el.title = s.durum === "ok" ? `${s.adet} kanal (${s.sure}s)` : (s.mesaj || "veri yok");
  });
}

function yukle() {
  document.getElementById("durum").textContent = "veri çekiliyor… (ilk açılış ~30 sn sürebilir)";
  fetch("/api/canli").then(r => r.json()).then(v => {
    TUM = v.kanallar || [];
    durumCiz(v);
    ciz();
    const k = v.kaynaklar || {};
    document.getElementById("durum").textContent =
      `${TUM.length} kanal · önbellek ${new Date((v.zaman||0)*1000).toLocaleTimeString("tr-TR")}`;
  }).catch(e => { document.getElementById("durum").textContent = "Hata: " + e; });
}

/* ---- kumanda / klavye ---- */
document.getElementById("arama").addEventListener("input", e => {
  ARAMA = e.target.value.trim().toLowerCase(); ciz();
});
document.querySelectorAll(".filtre").forEach(f => f.addEventListener("click", () => {
  document.querySelectorAll(".filtre").forEach(x => x.classList.remove("aktif"));
  f.classList.add("aktif"); KAYNAK = f.dataset.kaynak; ciz();
}));

function kartlar() { return [...document.querySelectorAll(".kart")]; }
document.addEventListener("keydown", e => {
  const k = kartlar();
  if (!k.length) return;
  const i = k.indexOf(document.activeElement);
  const kolon = Math.max(1, Math.round(
    document.querySelector(".grid").getBoundingClientRect().width / 274));
  if (e.key === "ArrowRight") { (k[Math.min(k.length - 1, i + 1)] || k[0]).focus(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { (k[Math.max(0, i - 1)] || k[0]).focus(); e.preventDefault(); }
  else if (e.key === "ArrowDown") { (k[Math.min(k.length - 1, i + kolon)] || k[0]).focus(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { (k[Math.max(0, i - kolon)] || k[0]).focus(); e.preventDefault(); }
  else if (e.key === "Enter" && document.activeElement.classList.contains("kart")) {
    window.open(document.activeElement.href, "_blank"); e.preventDefault();
  }
  else if (e.key.toLowerCase() === "c" && document.activeElement.classList.contains("kart")) {
    kopyala(document.activeElement.href); e.preventDefault();
  }
  else if (e.key === "/") { document.getElementById("arama").focus(); e.preventDefault(); }
  else if (e.key === "Escape") { document.activeElement.blur?.(); }
});

/* kart gorunur olunca odakla (TV icin) */
const gozlemci = new MutationObserver(() => {
  const k = kartlar();
  if (k.length && (document.activeElement === document.body || !document.activeElement)) k[0].focus();
});
gozlemci.observe(document.getElementById("icerik"), { childList: true, subtree: true });

yukle();
</script>
</body>
</html>
