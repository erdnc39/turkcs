# InatBox kanal listesini GitHub IP'si ile ceker (agimiz engelli oldugu icin)
# Sonuc: test_sayfasi/inat_cache.json -> TV sayfasi yedek olarak kullanir

name: InatBox Kanal Çekici

on:
  # * ZAMANLAMA TAMAMEN KALDIRILDI (ban üstüne ban yiyorduk).
  # * Bu workflow GitHub IP'sinden diziboxen.help'e 3 saatte bir istek atiyordu;
  # * sunucu hiz limiti koyunca 403/1006 donuyordu.
  # * Artik SADECE elle calisir: Actions > InatBox Kanal Cekici > Run workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  InatBoxCek:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu kontrol et
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari yukle
        run: pip install pycryptodome

      - name: InatBox listesini cek (SADECE elle calistirildiginda)
        run: python test_sayfasi/canli_tv_veri.py --inat --zorla

      - name: Yedegi kaydet
        run: |
          if [ -f test_sayfasi/inat_cache.json ]; then
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git add test_sayfasi/inat_cache.json
            git commit -m "InatBox kanal listesi guncellendi" || echo "degisiklik yok"
            git push || true
          else
            echo "Yedek dosya olusmadi (ag engeli olabilir) - mevcut yedek korundu"
          fi
