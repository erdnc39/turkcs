# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.

name: Eklenti Sağlık Kontrolü

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # * 2026-10-22: 9 saatte bir yerine GUNDE BIR (03:11 UTC).
    # * Nedeni: onceki akis yalnizca "mainUrl HTTP 200 mu" diye bakiyordu,
    # * 1 ay boyunca 5 calisan siteyi "erisim engeli, dokunma" diye isaretledi.
    # * Artik gercek eklenti testi de kosuyor; bu daha uzun suruyor ve
    # * 9 saatte bir calistirmak rate-limit riski tasiyor.
    - cron: 11 3 * * *

jobs:
  EklentiSaglik:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v4

      - name: Python Yükle
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereksinimleri Yükle
        run: |
          python -m pip install --upgrade pip
          # * Playwright KURULMAZ: GitHub runner'inda gercek Chrome ile
          # * Cloudflare challenge'i cozulemez ve headless zaten gecemiyor
          # * (olculdu: headless -> 403 "Bir dakika lutfen"). SAGLIK.py
          # * TARAYICI_VAR=False gorunce eski davranisa duser ve bunu
          # * raporda acikca "tarayici yok" diye yazar.
          pip install -U setuptools wheel

      - name: Sağlık Kontrolü + Gerçek Eklenti Testi
        run: |
          python araclar/SAGLIK.py --rapor

      - name: Raporu Özetle
        if: always()
        run: |
          echo "## Eklenti Sağlık Raporu" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f araclar/saglik_rapor.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          r = json.load(open("araclar/saglik_rapor.json", encoding="utf-8"))
          print("zaman:", r.get("zaman"))
          for k, v in (r.get("ozet") or {}).items():
              print(f"  {k}: {v}")
          e = r.get("eylem_gerekli") or []
          if e:
              print("\nEYLEM GEREKLI:")
              for x in e:
                  print(f"  - {x['eklenti']}: {x['durum']}")
          PY
          else
            echo "rapor uretilmedi" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Değişiklik Kontrolü
        id: degisiklik_kontrol
        run: |
          # * saglik_rapor.json her kosuda degisir; commit'e DAHIL EDILMEZ.
          git checkout -- araclar/saglik_rapor.json 2>/dev/null || true
          if git diff --quiet .; then
            echo "degisiklik=false" >> $GITHUB_OUTPUT
          else
            echo "degisiklik=true" >> $GITHUB_OUTPUT
          fi

      - name: Pull Request Oluştur
        if: steps.degisiklik_kontrol.outputs.degisiklik == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- araclar/saglik_rapor.json 2>/dev/null || true

          git commit --author="keyiflerolsun <keyiflerolsun@users.noreply.github.com>" \
            -m "♻️ Domain Değişikliği" \
            -m "🔄 Otomatik tespit edilen alan adı güncellemeleri."
          BRANCH="domain-degisikligi"

          git checkout -B $BRANCH
          git push origin $BRANCH --force

          curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/pulls \
            -d @- <<EOF
          {
            "title": "♻️ Domain Değişikliği",
            "head": "$BRANCH",
            "base": "master",
            "body": "🔄 Otomatik tespit edilen domain değişiklikleri uygulandı.\n\n📂 Lütfen değişiklikleri gözden geçirin."
          }
          EOF
