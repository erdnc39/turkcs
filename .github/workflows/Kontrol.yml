# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.

name: Eklenti Sağlık Kontrolü

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # * 2026-10-22: 9 saatte bir yerine GUNDE BIR (03:11 UTC).
    # * Onceki akis yalnizca "mainUrl HTTP 200 mu" diye bakiyordu ve 1 ay
    # * boyunca 5 CALISAN siteyi "erisim engeli, dokunma" diye isaretledi.
    - cron: 11 3 * * *

jobs:
  EklentiSaglik:
    # * 2026-10-22: SELF-HOSTED (yerel makine) ZORUNLU.
    # * Olcum (ayni gun, ayni kod):
    # *   GitHub bulut runner : SORUNSUZ 9  | ERISIM ENGELI 10 | CALISAN 2
    # *   yerel makine+Chrome : SORUNSUZ 19 | ERISIM ENGELI 2  | CALISAN 5
    # * Sebep 1: bulut runner IP araligi Cloudflare tarafindan biliniyor.
    # * Sebep 2: runner'da gercek Chrome yok; headless challenge'i gecemiyor
    # *           (olculdu: headless -> 403 "Bir dakika lutfen").
    # * 1 aydir otomasyon bu yuzden 10 siteyi "erisim engeli" saniyordu.
    runs-on: [self-hosted, Windows, X64]

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v4

      - name: Python Kontrolü
        shell: pwsh
        run: |
          python --version

      - name: Sağlık Kontrolü + Gerçek Eklenti Testi
        shell: pwsh
        run: |
          # * Yerel makinede Chrome + playwright oldugu icin 403/RST alan
          # * siteler gercekten dogrulanir. SAGLIK.py TARAYICI_VAR kontrolu
          # * ile bunu otomatik yapar.
          python araclar/SAGLIK.py --rapor

      - name: Raporu Özetle
        if: always()
        shell: pwsh
        run: |
          "## Eklenti Sağlık Raporu" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path araclar/saglik_rapor.json) {
            python araclar/rapor_ozet.py | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "rapor uretilmedi" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Değişiklik Kontrolü
        id: degisiklik_kontrol
        shell: pwsh
        run: |
          # * saglik_rapor.json her kosuda degisir; commit'e DAHIL EDILMEZ.
          git checkout -- araclar/saglik_rapor.json 2>$null
          git diff --quiet .
          if ($LASTEXITCODE -eq 0) {
            "degisiklik=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "degisiklik=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Pull Request Oluştur
        if: steps.degisiklik_kontrol.outputs.degisiklik == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- araclar/saglik_rapor.json 2>$null

          git commit --author="keyiflerolsun <keyiflerolsun@users.noreply.github.com>" `
            -m "♻️ Domain Değişikliği" `
            -m "🔄 Otomatik tespit edilen alan adı güncellemeleri."
          $BRANCH = "domain-degisikligi"

          git checkout -B $BRANCH
          git push origin $BRANCH --force

          $govde = @{
            title = "♻️ Domain Değişikliği"
            head  = $BRANCH
            base  = "master"
            body  = "🔄 Otomatik tespit edilen domain değişiklikleri uygulandı.`n`n📂 Lütfen değişiklikleri gözden geçirin."
          } | ConvertTo-Json

          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/$env:REPO_OWNER/$env:REPO_NAME/pulls" `
            -Headers @{ Authorization = "token $env:GITHUB_TOKEN"; Accept = "application/vnd.github.v3+json" } `
            -Body $govde
